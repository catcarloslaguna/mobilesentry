name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          pip install ruff mypy
          pip install -e "."

      - name: Lint with ruff
        run: |
          ruff check mobilesentry/

      - name: Type-check with mypy
        run: |
          mypy mobilesentry/ --ignore-missing-imports --no-strict-optional

      - name: Verify CLI builds
        run: |
          python -c "from mobilesentry.cli import build_parser; parser = build_parser(); print('✓ CLI parser builds successfully')"
